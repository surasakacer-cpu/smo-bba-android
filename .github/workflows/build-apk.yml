name: Build SMO BBA APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: unzip -q project.zip -d project
      - name: Align Java and Kotlin targets
        run: |
          sed -i '/android {/a\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }' project/app/build.gradle
          sed -i '/android {/a\    kotlinOptions { jvmTarget = "17" }' project/app/build.gradle
      - working-directory: project
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SMO-BBA-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
